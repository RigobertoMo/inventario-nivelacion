name: CI PHP Inventario

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Revisar sintaxis
        run: |
          php -l validacion.php
          php -l tests.php

      - name: Ejecutar pruebas
        run: php tests.php